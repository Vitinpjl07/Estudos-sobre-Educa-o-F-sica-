<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Fundamento de ataque (cortada) no vôlei">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4F9E"/>
      <stop offset="1" stop-color="#062D5C"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#E8A200"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="580" cy="320" r="140" fill="#ffffff" opacity="0.05"/>
  <rect x="0" y="300" width="640" height="100" fill="url(#court)"/>

  <!-- net -->
  <rect x="352" y="60" width="9" height="250" fill="#ffffff" opacity="0.55"/>
  <g stroke="#ffffff" stroke-width="1.6" opacity="0.3">
    <path d="M361 70 H 640 M 361 102 H 640 M 361 134 H 640 M 361 166 H 640 M 361 198 H 640 M 361 230 H 640 M 361 262 H 640 M 361 294 H 640"/>
  </g>

  <!-- bola -->
  <circle cx="338" cy="92" r="38" fill="#ffffff"/>
  <path d="M338 54 a 38 38 0 0 0 -32 20 l 18 27 a 38 38 0 0 0 28 11 z" fill="#FFD400"/>
  <path d="M338 54 a 38 38 0 0 1 32 20 l -24 18 a 38 38 0 0 0 -23 -6 z" fill="#0B4F9E"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- pernas (atleta no ar) -->
    <path d="M228 196 C 216 216, 208 234, 206 252" stroke="#e8b48c" stroke-width="25" fill="none"/>
    <path d="M246 196 C 242 218, 240 236, 242 252" stroke="#e8b48c" stroke-width="25" fill="none"/>
    <!-- sapatilhas -->
    <path d="M192 258 L 220 258" stroke="#0B4F9E" stroke-width="14" fill="none"/>
    <path d="M230 258 L 256 258" stroke="#0B4F9E" stroke-width="14" fill="none"/>
    <!-- tronco -->
    <path d="M236 200 C 240 176, 244 156, 248 140" stroke="#0B4F9E" stroke-width="60" fill="none"/>
    <!-- cabeça -->
    <circle cx="236" cy="100" r="27" fill="#3b2b22"/>
    <!-- braço da batida -->
    <path d="M256 138 C 278 120, 298 106, 316 96" stroke="#e8b48c" stroke-width="21" fill="none"/>
    <circle cx="322" cy="92" r="14" fill="#e8b48c"/>
    <!-- braço de apoio -->
    <path d="M238 150 C 222 132, 214 114, 218 98" stroke="#e8b48c" stroke-width="19" fill="none"/>
    <circle cx="218" cy="90" r="14" fill="#e8b48c"/>
  </g>

  <!-- trajetória da bola -->
  <path d="M378 78 C 444 66, 512 100, 552 180" fill="none" stroke="#FFD400" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M546 166 l 8 20 l -20 -4" fill="none" stroke="#FFD400" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="24" y="24" width="152" height="46" rx="23" fill="#FFD400"/>
    <text x="100" y="55" text-anchor="middle" font-size="21" font-weight="700" fill="#062D5C">ATAQUE</text>
  </g>
</svg>
