<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Finalização kimura no Jiu-Jitsu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4F9E"/>
      <stop offset="1" stop-color="#062D5C"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#E8A200"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/><circle cx="540" cy="70" r="120" fill="#ffffff" opacity="0.05"/><circle cx="90" cy="300" r="110" fill="#FFD400" opacity="0.07"/>
  <rect x="0" y="300" width="640" height="100" fill="url(#mat)"/>
  <rect x="0" y="300" width="640" height="7" fill="#0B4F9E" opacity="0.35"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- ===== Ukemi (azul) sentado, de costas para o atacante ===== --><circle cx="150" cy="212" r="28" fill="none" stroke="#07203d" stroke-width="7"/><circle cx="150" cy="212" r="28.0" fill="none" stroke="#0a2f5c" stroke-width="6"/><circle cx="150" cy="212" r="28" fill="#e8b48c"/>
    <path d="M178 220 C 215 235, 245 258, 262 282" fill="none" stroke="#07203d" stroke-width="71" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M178 220 C 215 235, 245 258, 262 282" stroke="#2f7fd4" stroke-width="64" fill="none"/>
    <!-- perna do ukemi dobrada -->
    <path d="M258 284 C 300 296, 340 300, 372 292" fill="none" stroke="#07203d" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M258 284 C 300 296, 340 300, 372 292" stroke="#2f7fd4" stroke-width="32" fill="none"/>
    <!-- braço do ukemi (alvo da kimura) -->
    <path d="M182 232 C 210 250, 235 268, 258 286" fill="none" stroke="#07203d" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M182 232 C 210 250, 235 268, 258 286" stroke="#e8b48c" stroke-width="21" fill="none"/><circle cx="264" cy="290" r="13.0" fill="none" stroke="#0a2f5c" stroke-width="6"/><circle cx="264" cy="290" r="13" fill="#e8b48c"/>

    <!-- ===== Atacante (branco) atrás, Controlando o braço ===== --><circle cx="392" cy="196" r="27" fill="none" stroke="#07203d" stroke-width="7"/><circle cx="392" cy="196" r="27.0" fill="none" stroke="#0a2f5c" stroke-width="6"/><circle cx="392" cy="196" r="27" fill="#3b2b22"/>
    <path d="M378 220 C 368 250, 360 272, 356 292" fill="none" stroke="#07203d" stroke-width="71" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M378 220 C 368 250, 360 272, 356 292" stroke="#ffffff" stroke-width="64" fill="none"/>
    <!-- mão do atacante segurando o pulso do ukemi -->
    <path d="M372 232 C 340 244, 310 258, 288 274" fill="none" stroke="#07203d" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 232 C 340 244, 310 258, 288 274" stroke="#ffffff" stroke-width="19" fill="none"/>
    <!-- segundo braço do atacante -->
    <path d="M364 258 C 330 270, 300 282, 276 292" fill="none" stroke="#07203d" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M364 258 C 330 270, 300 282, 276 292" stroke="#ffffff" stroke-width="19" fill="none"/>
    <!-- perna do atacante -->
    <path d="M360 292 C 410 300, 460 296, 500 282" fill="none" stroke="#07203d" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M360 292 C 410 300, 460 296, 500 282" stroke="#f4f6fb" stroke-width="32" fill="none"/>
  </g>

  <!-- seta de torção do braço --><circle cx="264" cy="290" r="24" fill="none" stroke="#FFD400" stroke-width="6" stroke-dasharray="9 7"/>
  <path d="M228 292 a 38 38 0 0 1 6 -42" fill="none" stroke="#07203d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 292 a 38 38 0 0 1 6 -42" fill="none" stroke="#0a2f5c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 292 a 38 38 0 0 1 6 -42" fill="none" stroke="#FFD400" stroke-width="8" stroke-linecap="round"/>
  <path d="M222 248 l 12 12 l 12 -12" fill="none" stroke="#07203d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M222 248 l 12 12 l 12 -12" fill="none" stroke="#0a2f5c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M222 248 l 12 12 l 12 -12" fill="none" stroke="#FFD400" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="24" y="24" width="164" height="46" rx="23" fill="#FFD400"/>
    <text x="106" y="55" text-anchor="middle" font-size="21" font-weight="700" fill="#062D5C">KIMURA</text>
  </g>
</svg>
