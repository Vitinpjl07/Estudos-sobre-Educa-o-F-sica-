    <circle cx="633" cy="82" r="42" fill="#3b2b22"/>
    <path d="M597 70 a 42 42 0 0 1 72 -4" stroke="#0B4F9E" stroke-width="14" fill="none"/>
  </g>

  <!-- bola -->
  <circle cx="800" cy="92" r="48" fill="#ffffff"/>
  <path d="M800 44 a 48 48 0 0 0 -41 26 l 22 33 a 48 48 0 0 0 37 14 z" fill="#FFD400"/>
  <path d="M800 44 a 48 48 0 0 1 41 26 l -31 22 a 48 48 0 0 0 -29 -9 z" fill="#0B4F9E"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="140" width="290" height="74" rx="37" fill="#FFD400"/>
    <text x="205" y="190" text-anchor="middle" font-size="40" font-weight="800" fill="#062D5C">VÔLEI</text>
  </g>
