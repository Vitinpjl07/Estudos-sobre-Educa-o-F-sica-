<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Finalização de braço (armbar) no Jiu-Jitsu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4F9E"/>
      <stop offset="1" stop-color="#062D5C"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#E8A200"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="570" cy="60" r="130" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="110" r="90" fill="#FFD400" opacity="0.07"/>
  <rect x="0" y="300" width="640" height="100" fill="url(#mat)"/>
  <rect x="0" y="300" width="640" height="7" fill="#0B4F9E" opacity="0.35"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- ===== UKEMI (kimono azul) à direita ===== -->
    <path d="M470 268 C 512 262, 546 264, 572 270" stroke="#2f7fd4" stroke-width="58" fill="none"/>
    <circle cx="592" cy="274" r="27" fill="#e8b48c"/>
    <path d="M572 254 a 27 27 0 0 1 44 -6" stroke="#3b2b22" stroke-width="11" fill="none"/>
    <!-- braço do ukemi se estendendo para a esquerda -->
    <path d="M474 284 C 430 288, 392 292, 352 296" stroke="#e8b48c" stroke-width="19" fill="none"/>
    <circle cx="342" cy="298" r="12" fill="#e8b48c"/>

    <!-- ===== ATACANTE (kimono branco) à esquerda ===== -->
    <circle cx="86" cy="228" r="26" fill="#3b2b22"/>
    <path d="M112 236 C 148 248, 182 262, 212 274" stroke="#ffffff" stroke-width="60" fill="none"/>
    <!-- cinto do kimono -->
    <path d="M196 252 L 178 288" stroke="#0B4F9E" stroke-width="14" fill="none"/>
    <!-- perna de cima (abre o "V" com a perna de baixo) -->
    <path d="M212 270 C 252 258, 296 250, 340 252 C 366 253, 386 258, 400 266" stroke="#f4f6fb" stroke-width="24" fill="none"/>
    <circle cx="408" cy="269" r="12" fill="#e8b48c"/>
    <!-- perna de baixo -->
    <path d="M214 282 C 250 300, 288 314, 330 320" stroke="#e8eefc" stroke-width="24" fill="none"/>
    <!-- braço que segura o pulso do ukemi -->
    <path d="M150 246 C 190 268, 236 284, 300 294" stroke="#ffffff" stroke-width="17" fill="none"/>
  </g>

  <!-- alavanca: mão do ukemi presa + direção da força -->
  <circle cx="342" cy="298" r="24" fill="none" stroke="#FFD400" stroke-width="6" stroke-dasharray="10 8"/>
  <path d="M300 242 C 322 232, 348 238, 362 258" fill="none" stroke="#FFD400" stroke-width="8" stroke-linecap="round"/>
  <path d="M356 248 l 10 12 l 12 -10" fill="none" stroke="#FFD400" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="24" y="24" width="186" height="46" rx="23" fill="#FFD400"/>
    <text x="117" y="55" text-anchor="middle" font-size="21" font-weight="700" fill="#062D5C">ARMBAR</text>
  </g>
</svg>
